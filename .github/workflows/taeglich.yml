name: Seiten täglich erneuern
# Erzeugt jeden Tag um 01:30 Uhr (deutsche Zeit) die Städteseiten (de/tr), Themenseiten und die Sitemap neu.
# Ein Push auf main wird von Hostinger automatisch veröffentlicht.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tools/build.sh
      - name: Änderungen speichern
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ruhaniyya-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Seiten für $(date +%Y-%m-%d) neu erzeugt"
            git push
          fi
